# Local override: gives windows x86_64 two toolchain lanes (vs2022/gcc) and win-arm64 a zig lane.
c_compiler:
  - if: not unix and x86_64
    then:
      - vs2022
      - gcc
  - if: not unix and arm64
    then:
      - zig

# experimental: build against and upload to the ocaml_experimental label
ocaml_compiler_version:
  - "5.5.1"

channel_sources:
  - conda-forge/label/ocaml_experimental,conda-forge
channel_targets:
  - conda-forge ocaml_experimental
